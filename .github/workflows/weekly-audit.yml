name: Weekly recall audit

on:
  # 08:00 Melbourne AEST Saturday = 22:00 UTC Friday.
  # Swap to '0 21 * * 5' during AEDT (Oct–Apr) — see README.
  schedule:
    - cron: '0 22 * * 5'
  workflow_dispatch:
    inputs:
      week_ending:
        description: 'ISO date (YYYY-MM-DD) for the Saturday ending the week. Blank = today Melbourne.'
        required: false
        default: ''

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # to dispatch the email workflows below
    outputs:
      failed_tests: ${{ steps.capture.outputs.failed }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML feedparser pytest

      - name: Run test suite
        id: tests
        # Gate the rebuild on the test suite passing — a failing data-integrity
        # test (e.g. the double-count or unreviewed-money guards) must block
        # the weekly commit/email, not just be discoverable after the fact by
        # someone running pytest locally.
        run: |
          set -o pipefail
          python3 -m pytest tests/ -q 2>&1 | tee /tmp/pytest.txt

      - name: Capture failing tests for the alert
        # notify-failure cannot read these back from the run log: `gh run view
        # --log-failed` refuses while the run is still in progress, and the run
        # IS in progress — notify-failure is part of it. (First observed
        # 2026-08-25: the alert fired correctly but said "not in the test
        # suite" for a run with two red tests.) So hand the names forward as a
        # job output instead of trying to recover them afterwards.
        id: capture
        if: failure()
        run: |
          FAILED=$(grep -oE '^FAILED [^ ]+' /tmp/pytest.txt 2>/dev/null \
                    | sed 's/^FAILED //' | sort -u | head -20 || true)
          {
            echo 'failed<<PYTEST_EOF'
            printf '%s\n' "$FAILED"
            echo 'PYTEST_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run weekly audit
        env:
          PYTHONUNBUFFERED: '1'
          WEEK_ENDING: ${{ github.event.inputs.week_ending }}
        run: |
          if [ -n "${WEEK_ENDING}" ]; then
            python3 scripts/weekly_audit.py --week-ending "${WEEK_ENDING}"
          else
            python3 scripts/weekly_audit.py
          fi

      - name: Rebuild CCS Intelligence Dashboard
        # Refreshes every derived reliability layer before rendering the live
        # dashboard and a dated board snapshot. The downloaded source editions
        # stay pinned and are refreshed only by their dedicated import routines.
        env:
          PYTHONUNBUFFERED: '1'
          WEEK_ENDING: ${{ github.event.inputs.week_ending }}
        run: |
          SNAP="${WEEK_ENDING:-$(TZ=Australia/Melbourne date +%Y-%m-%d)}"
          python3 scripts/build_entity_register.py
          python3 scripts/build_baseline_comparison.py
          python3 scripts/coverage_report.py --date "${SNAP}" --window 14
          python3 scripts/build_reliability_model.py
          BUILD_DATE="${SNAP}" python3 scripts/build_dashboard.py --snapshot "${SNAP}"

      - name: Commit audit report + dashboard
        id: commit
        run: |
          set -euo pipefail
          git config user.email 'ccs-news-routine@co2crc.com.au'
          git config user.name  'CCS Weekly Audit'
          git add audit/*-recall-report.html audit/*-recall-report.md audit/drift.json 2>/dev/null || true
          git add dashboard/index.html dashboard/snapshots/*.html dashboard/data/entities dashboard/data/baselines/comparison dashboard/data/coverage dashboard/data/model 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No audit or dashboard changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Weekly audit + dashboard $(TZ=Australia/Melbourne date +%Y-%m-%d)"
          git pull --rebase --autostash
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch email workflows
        # The push above uses the default GITHUB_TOKEN, and GitHub suppresses
        # push-triggered workflows for GITHUB_TOKEN pushes (anti-recursion), so
        # email-audit.yml and email-dashboard.yml never fire from it. Dispatch
        # them explicitly instead — workflow_dispatch via the API is exempt from
        # that suppression. (First missed Saturday: 2026-07-18.)
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK_ENDING: ${{ github.event.inputs.week_ending }}
        run: |
          set -euo pipefail
          SNAP="${WEEK_ENDING:-$(TZ=Australia/Melbourne date +%Y-%m-%d)}"
          gh workflow run email-audit.yml     --repo "$GITHUB_REPOSITORY" -f date="$SNAP"
          gh workflow run email-dashboard.yml --repo "$GITHUB_REPOSITORY" -f date="$SNAP"
          echo "Dispatched email-audit and email-dashboard for $SNAP"

  notify-failure:
    # Without this the audit fails silently: no report, no dashboard, no email,
    # and nothing that reaches a human. That is exactly what happened on
    # 2026-08-08, -15 and -22 — three consecutive red Saturdays went unnoticed
    # for three weeks because the only symptom was an email that never arrived.
    # Scheduled runs only; a manual run is attended by whoever dispatched it.
    needs: audit
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Alert via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_TESTS: ${{ needs.audit.outputs.failed_tests }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY}" ]; then
            echo "::error::RESEND_API_KEY secret is not set in this repo"
            exit 1
          fi
          TODAY=$(TZ=Australia/Melbourne date +%Y-%m-%d)

          # Names handed forward by the audit job's capture step — see the note
          # there for why they are not read back out of the run log.
          FAILURES=$(printf '%s' "${FAILED_TESTS}" | sed '/^[[:space:]]*$/d')

          {
            echo "<p>The weekly recall audit failed on ${TODAY} (Melbourne). <strong>No recall report and no dashboard were produced, and neither email was sent.</strong></p>"
            if [ -n "$FAILURES" ]; then
              echo "<p>Failing tests:</p><ul>"
              printf '%s\n' "$FAILURES" | while IFS= read -r t; do
                [ -n "$t" ] && echo "<li><code>${t}</code></li>"
              done
              echo "</ul>"
              echo "<p>The rebuild is gated on the test suite by design — a data-integrity guard (unmapped countries, unreviewed money, double-counting) blocks the weekly commit rather than shipping a wrong dashboard. Fix the underlying data, then re-run.</p>"
            else
              echo "<p>The failure was not in the test suite — check the run log for the failing step.</p>"
            fi
            echo "<p><a href=\"${RUN_URL}\">Open the failed run</a>. To rebuild a specific week once fixed: Actions tab &rarr; Weekly recall audit &rarr; Run workflow, with <code>week_ending</code> set to that Saturday.</p>"
          } > /tmp/body.html

          jq -n \
            --arg subject "ALERT: weekly CCS audit + dashboard failed — ${TODAY}" \
            --rawfile html /tmp/body.html \
            '{
              from: "CCS Briefing <onboarding@resend.dev>",
              to: ["matthias.raab@co2crc.com.au"],
              subject: $subject,
              html: $html
            }' > /tmp/resend.json

          HTTP=$(curl -sS -o /tmp/resend.out -w '%{http_code}' \
            -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/resend.json)
          echo "Resend HTTP $HTTP"
          cat /tmp/resend.out
          echo
          case "$HTTP" in
            2*) echo "::notice::Failure alert emailed" ;;
            *)  echo "::error::Resend rejected the alert (HTTP $HTTP)"; exit 1 ;;
          esac
