name: Authoritative CCS source monitor

on:
  schedule:
    - cron: "17 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fingerprint authoritative sources
        run: python scripts/monitor_authoritative_sources.py
      - name: Commit monitor state when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/monitoring
          git diff --cached --quiet || git commit -m "chore: refresh authoritative source fingerprints"
          git push
